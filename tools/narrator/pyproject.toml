[project]
name = "lantern-narrator"
version = "1.0.0"
description = "Local neural audiobook generation for Lantern (Kokoro, Pocket TTS, Qwen3-TTS)"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26", "soundfile>=0.12"]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4.9"]
pocket = ["pocket-tts>=1.0"]
mlx = ["mlx-audio>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
lantern-narrate = "lantern_narrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lantern_narrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
